<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="../main/icon-192.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
<title>세트마크</title>
</head>
<body>
<script>
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
  location.replace('../');
}
</script>
<main id="install-guide" class="install-guide">
  <header class="install-header">
    <img src="../main/icon-192.png" width="64" height="64" alt="">
    <h1>세트마크</h1>
    <p>홈 화면에 추가해서 운동을 기록해 보세요.</p>
  </header>
  <section class="card" aria-labelledby="install-title">
    <h2 id="install-title">iPhone에 추가하기</h2>
    <p>카카오톡에서 열었다면 링크를 복사해 <strong>Safari</strong>에서 열어요.</p>
    <ol class="install-steps">
      <li>
        주소창 옆 <strong>페이지 메뉴</strong> 버튼을 눌러요.
        <img src="./install-step-1.jpg" alt="Safari 주소창 왼쪽의 페이지 메뉴 버튼이 강조된 화면">
      </li>
      <li>
        <strong>공유</strong>를 눌러요.
        <img src="./install-step-share.jpg" alt="Safari 페이지 메뉴에서 공유 버튼이 강조된 화면">
      </li>
      <li>
        <strong>더 보기</strong>를 눌러요.
        <img src="./install-step-2.jpg" alt="페이지 메뉴 오른쪽의 더 보기 버튼이 강조된 화면">
      </li>
      <li>
        <strong>홈 화면에 추가</strong>를 선택해요.
        <img src="./install-step-3.jpg" alt="홈 화면에 추가 메뉴가 강조된 화면">
      </li>
      <li>
        <strong>웹 앱으로 열기</strong>가 보이면 켜고, 오른쪽 위 <strong>추가</strong>를 눌러요.
        <img src="./install-step-4.jpg" alt="웹 앱으로 열기가 켜져 있고 오른쪽 위 추가 버튼이 강조된 화면">
      </li>
    </ol>
    <p>Safari에 <strong>공유</strong> 버튼(□↑)이 바로 보이면, 공유 메뉴에서 <strong>홈 화면에 추가</strong>를 찾을 수 있어요.</p>
    <p>추가한 뒤 홈 화면의 <strong>세트마크</strong> 아이콘을 눌러요.</p>
  </section>
</main>
</body>
</html>
